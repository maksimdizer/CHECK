server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_read_timeout 60s;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
